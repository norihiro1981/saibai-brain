[project]
name = "saibai"
version = "0.1.0"
description = "栽培室の頭脳：役割の違うエージェントが運転の計画を出し、決まった規則の守りの層が入切に変える"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "httpx",
    "mcp",
    "pandas",
    "python-dotenv",
]

[project.scripts]
saibai-receiver = "saibai.receiver:main"
saibai-mcp = "saibai.mcp_server:main"
saibai-agents = "saibai.agents:main"
saibai-weather-history = "saibai.weather_history:main"

[project.optional-dependencies]
# 温湿度計の Bluetooth を直接読む予備の道（主の道はクラウドの 30 秒）
ble = ["bleak"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saibai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 日本語の文は幅が広いので行の長さは ruff format に任せる
ignore = ["E501"]
