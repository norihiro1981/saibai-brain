# 守りの層の線と狙いの帯（設計書 §5・§9）。線の値はここにだけ書く。
# 本番に戻す時（例：入と入の間を 30 分に）は、このファイルだけを書き換える。

[guard]
# 75% 以上から足すと止める線（85%）まですぐ届き、結露と過湿の恐れが大きい
no_start_rh = 75.0
# 85% は葉や鉢の表面の結露と病気の恐れが出る線＝計画の残りに関わらず切る
stop_rh = 85.0
# 切ってから次に入れるまで。1 分は連打で入切がばたつかないための下限（v0.6・デモと試しの間）。
# 本番は 30（加湿器は 30 分で +12〜16 pt 動く（11/3）＝効き目を見る前に次を入れない）
min_gap_min = 1
# 5 分読めていない値は今の部屋を表さない
stale_after_min = 5
# 温度と湿度がそろって 90 分まったく動かないのは、センサーかクラウドが止まった疑い
# （クラウドの湿度は整数で、工場の夜は温度も湿度も 45 分そのままだった（11/4）＝その倍）
stuck_after_min = 90
# 加湿器は 30 分で +12〜16 pt（11/3）＝15 分で 1 pt も上がらなければ、効いていないか値が止まっている
no_rise_after_min = 15
no_rise_pt = 1.0
# 1 分で 10 pt は加湿器でも出ない跳び＝センサーの不具合の疑い
jump_pt = 10.0
# 跳びとみなす隣り合う読みの間（読みは 30〜61 秒ごと・1 回抜けても拾う）
jump_within_min = 2
# 跳びを疑い続ける間
jump_recent_min = 15
# 計画を出す側が止まったら、古い計画で動き続けない
plan_timeout_h = 3
# 判断の間（受け手は毎分判断する）
tick_min = 1
# これより先の計画は受けない（1 日分あれば足りる）
horizon_h = 36

# 本物の実機の線（人が付く日）
[guard.real]
max_continuous_min = 60
max_daily_min = 120

# 再生（模擬の栽培室）の線
[guard.replay]
max_continuous_min = 180
max_daily_min = 360

# 狙いの VPD の帯（表示だけ・入力欄は作らない）。data/knowledge_seed.md §1 から：
# 上＝0.82 kPa を越えると収量が下がる（産地の閾値）の手前・下＝RH 70〜80% の目安を 15〜20℃ で VPD にした 0.34〜0.47 の間
[target]
vpd_low_kpa = 0.4
vpd_high_kpa = 0.8

[receiver]
# 温湿度計をクラウドから読む間（1 日 2,880 回＝上限 1 万回の内・設計書 §8）
read_every_s = 30
# 最後の記録からこれより空いたら「記録なし（受け手が止まっていた）」を 1 件残す
gap_after_min = 2
